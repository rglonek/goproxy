# Terminate TLS with your own certificate, and redirect plain HTTP to HTTPS.
#
# Generate a self-signed pair to try it out:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout snakeoil.key -out snakeoil.crt -subj "/CN=localhost"
#
# When tls is set, the plain HTTP listener stops serving rules and only issues
# 301 redirects to https://, so listen_addr does not need to be :80 here.

listen_addr: ":8080"
log_level: info

tls:
  listen_addr: ":8443"
  certs:
    cert_file: "snakeoil.crt"
    key_file: "snakeoil.key"

rules:
  - proxy_rule:
      proxy_url: "http://127.0.0.1:8081"
      proxy_append_path: true
