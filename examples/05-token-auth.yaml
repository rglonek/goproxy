# Guard an API with static tokens.
#
#   ./goproxy -config examples/05-token-auth.yaml
#   curl -i http://localhost:8080/api/             # 401
#   curl -H 'X-TOKEN: token1' http://localhost:8080/api/
#
# forward_header: false (the default) removes the token header before the
# request is proxied to the backend.

listen_addr: ":8080"
log_level: info

rules:
  - path_match: "/api"
    token_auth:
      tokens:
        - "token1"
        - "token2"
      token_auth_header: "X-TOKEN"
      forward_header: false
    proxy_rule:
      proxy_url: "http://127.0.0.1:8081"
      proxy_append_path: true
