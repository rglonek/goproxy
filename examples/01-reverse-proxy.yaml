# The simplest useful config: forward everything to one backend.
#
#   ./goproxy -config examples/01-reverse-proxy.yaml
#   curl http://localhost:8080/anything
#
# With no match block, the rule matches every request.

version: 2

listeners:
  http:
    addr: ":8080"

rules:
  - name: everything
    proxy:
      url: "http://127.0.0.1:8081"
