# Redirect one path, return a canned response for everything else.
#
#   ./goproxy -config examples/03-redirect-and-respond.yaml
#   curl -i http://localhost:8080/old-docs   # 301 to the new location
#   curl -i http://localhost:8080/           # 403 Forbidden
#
# Rules are evaluated top to bottom and the first match wins, so a rule with no
# domain_match/path_match acts as a catch-all and must come last.

listen_addr: ":8080"
log_level: info

rules:
  - path_match: "/old-docs"
    redirect_rule:
      redirect_url: "https://example.com/docs"
      redirect_status_code: 301 # must be a 3xx code

  - respond_rule:
      respond_status_code: 403
      respond_body: "Forbidden"
