# Redirects and canned responses, and how rule order works.
#
# Rules are evaluated in order and the first match wins, so the catch-all goes
# last. {path} and {query} are filled in from the request, which is what makes
# "this whole tree moved" expressible.

version: 2

listeners:
  http:
    addr: ":8080"

rules:
  - name: old-docs
    match:
      path: "/old-docs"
    redirect:
      to: "https://example.com/docs{path}{query}"
      status: 301 # must be a 3xx code

  - name: catch-all
    respond:
      status: 403
      body: "<h1>Forbidden</h1>"
      content_type: "text/html; charset=utf-8"
      headers:
        X-Frame-Options: DENY
