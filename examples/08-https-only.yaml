# HTTPS only: no plain HTTP listener at all.
#
# listen_addr may be omitted when tls.listen_addr is set. Nothing will be
# listening on port 80, so there is no HTTP-to-HTTPS redirect either. This does
# not work with lets_encrypt, which needs port 80 for the http-01 challenge.

log_level: info

tls:
  listen_addr: ":443"
  certs:
    cert_file: "/etc/ssl/certs/example.com.crt"
    key_file: "/etc/ssl/private/example.com.key"

rules:
  - proxy_rule:
      proxy_url: "http://127.0.0.1:8081"
      proxy_append_path: true
